[package]
name = "loupe-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "loupe scan/verify worker — leases jobs, clones repos, runs scanners, reports findings."
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[[bin]]
name = "loupe-worker"
path = "src/main.rs"

[features]
# Explicit synthetic Sandbox fixture authority for sibling integration tests.
# Opting in is permitted outside tests too; keep it out of normal dependencies.
test-support = []

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
git2 = { workspace = true }
glob = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
loupe-core = { version = "0.1.0", path = "../loupe-core" }
loupe-http = { version = "0.1.0", path = "../loupe-http" }
loupe-proto = { version = "0.1.0", path = "../loupe-proto" }
loupe-provenance = { version = "0.1.0", path = "../loupe-provenance", features = ["ingress"] }
loupe-tls = { version = "0.1.0", path = "../loupe-tls" }
regex = { workspace = true }
reqwest = { workspace = true }
rustix = { workspace = true, features = ["event", "net"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true, features = ["display"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio-rustls = { workspace = true }
# Keep this test dependency path-only: Cargo omits it on publication,
# avoiding a server/worker cycle in the registry dependency graph.
loupe-server = { path = "../loupe-server" }
loupe-storage = { version = "0.1.0", path = "../loupe-storage" }
tempfile = { workspace = true }

[lints]
workspace = true
