[package]
name = "loupe-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "loupectl — admin CLI for loupe-server."
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[[bin]]
name = "loupectl"
path = "src/main.rs"

[dependencies]
bytes = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
loupe-core = { version = "0.1.0", path = "../loupe-core" }
loupe-http = { version = "0.1.0", path = "../loupe-http" }
loupe-proto = { version = "0.1.0", path = "../loupe-proto" }
loupe-provenance = { version = "0.1.0", path = "../loupe-provenance", features = ["ingress"] }
loupe-tls = { version = "0.1.0", path = "../loupe-tls" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true }

[dev-dependencies]
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tempfile = { workspace = true }
tokio-rustls = { workspace = true }

[lints]
workspace = true
