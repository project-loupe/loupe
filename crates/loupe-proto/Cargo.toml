[package]
name = "loupe-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Wire protocol DTOs shared between loupe-server, loupe-worker, and loupe-cli."
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
loupe-core = { version = "0.1.0", path = "../loupe-core" }
loupe-provenance = { version = "0.1.0", path = "../loupe-provenance" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
loupe-core = { version = "0.1.0", path = "../loupe-core", features = ["source-migration"] }
loupe-provenance = { version = "0.1.0", path = "../loupe-provenance", features = ["ingress"] }
serde_json = { workspace = true, features = ["raw_value"] }

[lints]
workspace = true
