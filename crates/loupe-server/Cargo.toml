[package]
name = "loupe-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "loupe job-queue daemon: registers repos, schedules scans, dispatches reports."
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[[bin]]
name = "loupe-server"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
tower = { workspace = true }
loupe-core = { version = "0.1.0", path = "../loupe-core" }
loupe-proto = { version = "0.1.0", path = "../loupe-proto" }
loupe-storage = { version = "0.1.0", path = "../loupe-storage" }
loupe-tls = { version = "0.1.0", path = "../loupe-tls" }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
rand_core = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tokio-rustls = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
git2 = { workspace = true }
loupe-tls = { version = "0.1.0", path = "../loupe-tls" }
# Keep this test dependency path-only: Cargo omits it on publication,
# avoiding a server/worker cycle in the registry dependency graph.
loupe-worker = { path = "../loupe-worker" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "json"] }
tempfile = { workspace = true }
tokio-util = { workspace = true }

[lints]
workspace = true
