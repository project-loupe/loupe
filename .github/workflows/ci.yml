name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: /tmp/cargo-target-loupe-ci
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check all shell scripts
        run: ci/shellcheck.sh

  fmt:
    name: rustfmt (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly toolchain with rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly formatting and doctest tools
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y apparmor bubblewrap curl jq mawk
      - name: Enable sandbox user namespaces
        run: |
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          bwrap --unshare-user --unshare-net --unshare-pid --ro-bind / / --dev /dev -- /bin/true
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: Check tests and security boundaries
        run: ci/check.sh

  fuzz-replay:
    name: Fuzz corpus replay
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg=fuzzing
      CARGO_TARGET_DIR: /tmp/cargo-target-loupe-fuzz-replay
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Replay helpers and committed inputs
        run: |
          cargo test --manifest-path fuzz/Cargo.toml --lib
          cargo test --manifest-path fuzz/runners/Cargo.toml --features stdin_fuzz --bins
      - name: Verify runner generation and replay failures
        run: |
          sh fuzz/test-harness.sh
          sh fuzz/src/bin/gen_target.sh
          git diff --exit-code -- fuzz/runners/src/bin fuzz/targets.h
          test -z "$(git ls-files --others --exclude-standard fuzz/runners/src/bin fuzz/targets.h)"

  fuzz:
    name: Fuzz (5 minutes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: /tmp/cargo-target-loupe-ci-fuzz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz a random target for five minutes
        run: |
          target=$(awk '$1 == "GEN_TEST" && $2 != "smoke" { print $2 "_target" }' fuzz/src/bin/gen_target.sh | shuf -n 1)
          echo "Fuzzing $target for 300 seconds"
          ci/fuzz.sh "$target" 300
      - name: Preserve crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz/runners/artifacts/
          if-no-files-found: ignore
